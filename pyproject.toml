[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-merkle-tree"
version = "1.0.0"
description = "Merkle Tree with inclusion/exclusion proofs"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "merkle-tree", "cryptography", "blockchain", "data-structures"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-merkle-tree"
Repository = "https://github.com/ElNeMeR70/py-merkle-tree"
